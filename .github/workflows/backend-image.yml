name: Backend container
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: calendar-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify health and authentication
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name calendar-smoke -p 127.0.0.1:47821:47821 calendar-backend:test
          trap 'docker rm -f calendar-smoke' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:47821/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"query":"{ mode }"}' http://127.0.0.1:47821/graphql)" = 401
          docker stop --time 10 calendar-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' calendar-smoke)" = 0
      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calendar-backend"
          docker tag calendar-backend:test "$image:sha-$GITHUB_SHA"
          docker tag calendar-backend:test "$image:main"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:main"
