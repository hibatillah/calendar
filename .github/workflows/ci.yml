name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: ./scripts/cargo.ps1 fmt --all '--' --check
      - name: Desktop watcher checks
        run: ./scripts/test-dev-desktop.ps1
      - name: Tests including GPUI interactions
        run: ./scripts/cargo.ps1 test --locked --workspace --features calendar-desktop/ui-tests
      - name: Clippy
        run: ./scripts/cargo.ps1 clippy --locked --workspace --all-targets --features calendar-desktop/ui-tests '--' '-D' warnings

  windows-desktop:
    name: Windows portable build
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: rust-checks
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - name: Build desktop and local backend
        run: ./scripts/cargo.ps1 build --locked --release --workspace
      - name: Package portable application
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-windows-x64-${{ github.sha }}
          path: dist/calendar-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
