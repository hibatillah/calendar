name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: ./scripts/cargo.ps1 fmt --all '--' --check
      - name: Tests including GPUI interactions
        run: ./scripts/cargo.ps1 test --locked --workspace --features randevu-desktop/ui-tests
      - name: Clippy
        run: ./scripts/cargo.ps1 clippy --locked --workspace --all-targets --features randevu-desktop/ui-tests '--' '-D' warnings

  windows-desktop:
    name: Windows portable build
    needs: rust-checks
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - name: Build desktop and local backend
        run: ./scripts/cargo.ps1 build --locked --release --workspace
      - name: Package portable application
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: randevu-windows-x64-${{ github.sha }}
          path: dist/randevu-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
