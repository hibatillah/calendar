name: Mobile
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/mobile lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --cwd apps/mobile export
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:mobile
  android:
    name: Android preview APK
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-android-preview-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  ios:
    name: iOS simulator build
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform ios
        working-directory: apps/mobile
      - run: xcodebuild -workspace Calendar.xcworkspace -scheme Calendar -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile/ios
      - run: tar -czf calendar-ios-simulator.tar.gz -C build/Build/Products/Release-iphonesimulator Calendar.app
        working-directory: apps/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-ios-simulator-${{ github.sha }}
          path: apps/mobile/ios/calendar-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
