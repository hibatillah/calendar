name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  desktop:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calendar-windows-x64-${{ github.sha }}
          path: release-assets
      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s calendar-windows-x64.zip
          test -s calendar-windows-x64.msi
          sha256sum calendar-* > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: preview-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" = "false" ]; then
              echo "Release already published; leaving assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Calendar preview ${GITHUB_RUN_NUMBER}" --generate-notes \
              --notes "Development preview for Windows. Unsigned. Requires your own Google OAuth client; see docs/google.md."
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
