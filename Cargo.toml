[workspace]
members = ["apps/desktop", "apps/backend", "crates/calendar-core", "crates/calendar-layout", "crates/telemetry"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
calendar-core = { path = "crates/calendar-core" }
calendar-layout = { path = "crates/calendar-layout" }
randevu-telemetry = { path = "crates/telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[profile.dev]
debug = 0
incremental = true

