[package]
name = "calendar-desktop"
version.workspace = true
edition.workspace = true

[features]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.7.1", default-features = false, features = [
  "component",
  "assets",
] }
calendar-core.workspace = true
calendar-layout.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel = "2"
uuid.workspace = true
calendar-google = { path = "../calendar-google" }
calendar-sync = { path = "../calendar-sync" }

[dev-dependencies]
percent-encoding = "2"
calendar-google = { path = "../calendar-google", features = ["test-support"] }
calendar-sync = { path = "../calendar-sync", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

